name: job watch

on:
  schedule:
    # Every 2 hours at 17 past. Two deliberate choices. GitHub throttles scheduled
    # workflows hardest when they fire often, and a */15 cron here was dropped
    # entirely for six hours straight with no failed run to show for it. And :17
    # avoids the top of the hour, when most of GitHub's cron jobs fire at once.
    # Expect the run to start a few minutes after :17 even when it works.
    - cron: "17 */2 * * *"
  workflow_dispatch:

# Never let two runs overlap: both would read the same state and the second would
# re-alert on everything the first already claimed.
#
# The group name is versioned on purpose. A run that gets stuck in GitHub's queue
# cannot be cancelled and blocks every later run in its group, which would silently
# stop the watcher forever. If that happens again, bump the suffix and push.
concurrency:
  group: job-watch-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check boards and alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 run.py

      - name: Commit state if it changed
        run: |
          git config user.name "job-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:"${GITHUB_REF_NAME}"
